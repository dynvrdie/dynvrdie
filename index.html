<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potato Verification Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card" style="position: relative;">

        <!-- Theme Controls -->
        <div style="
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 5px;
        ">
            <button
                onclick="toggleGrayscale()"
                style="padding: 5px 8px; font-size: 11px; background-color: #333;">
                ⚫ Black & White
            </button>

            <button
                onclick="toggleDarkMode()"
                style="padding: 5px 8px; font-size: 11px; background-color: #555;">
                🌙 Dark
            </button>
        </div>

        <!-- Hero Potato Banner -->
        <img
            id="potatoImageBanner"
            src="https://images.unsplash.com/photo-1518977676601-b53f82aba655?auto=format&fit=crop&w=600&q=80"
            alt="Potatoes"
            style="
                width: 100%;
                height: 160px;
                object-fit: cover;
                border-radius: 8px;
                margin-bottom: 15px;
                margin-top: 25px;
                border: 1px solid #ddd;
            "
        >

        <!-- Main Heading -->
        <h1>🥔 Potato Verification System</h1>

        <!-- Verification Section -->
        <div>
            <p>Enter a registry ID (e.g., POT-1001)</p>

            <div class="input-group">
                <input
                    type="text"
                    id="potatoIdInput"
                    placeholder="e.g. POT-1001"
                    style="
                        padding: 8px;
                        width: 80%;
                        border-radius: 6px;
                        border: 1px solid #ccc;
                    "
                >
            </div>

            <button
                onclick="verifyPotato()"
                style="margin-top: 10px;">
                Verify ID
            </button>
        </div>

        <!-- Result Section -->
        <div id="result" class="result-box hidden">

            <h3 id="resultStatus"></h3>

            <p id="resultDetails"></p>

            <button
                id="certBtn"
                onclick="printCertificate()"
                class="hidden"
                style="
                    background-color: #2b5b84;
                    margin-top: 10px;
                ">
                📄 Print Certificate
            </button>

        </div>

        <hr style="
            margin: 25px 0;
            border: 0;
            border-top: 1px solid #ddd;
        ">

        <!-- Register New Potato -->
        <div>

            <h3>Register New Potato</h3>

            <input
                type="text"
                id="regName"
                placeholder="Variety Name (e.g. Sweet Potato)"
                style="
                    padding: 8px;
                    width: 80%;
                    margin-bottom: 8px;
                    border-radius: 6px;
                    border: 1px solid #ccc;
                "
            >

            <br>

            <input
                type="text"
                id="regOrigin"
                placeholder="Origin (e.g. Peru)"
                style="
                    padding: 8px;
                    width: 80%;
                    margin-bottom: 12px;
                    border-radius: 6px;
                    border: 1px solid #ccc;
                "
            >

            <br>

            <button
                onclick="registerPotato()"
                style="background-color: #385723;">
                Register & Get ID
            </button>

        </div>

        <hr style="
            margin: 25px 0;
            border: 0;
            border-top: 1px solid #ddd;
        ">

        <!-- Registry Section -->
        <div>

            <h3>Database Registry Log</h3>

            <!-- Search -->
            <div style="
                margin-bottom: 12px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                align-items: center;
            ">

                <input
                    type="text"
                    id="tableSearchInput"
                    onkeyup="filterRegistryTable()"
                    placeholder="🔍 Search by ID, name, or origin..."
                    style="
                        padding: 8px;
                        width: 90%;
                        border-radius: 6px;
                        border: 1px solid #ccc;
                    "
                >

                <!-- CSV Controls -->
                <div style="
                    display: flex;
                    gap: 8px;
                    justify-content: center;
                    align-items: center;
                ">

                    <button
                        onclick="exportToCSV()"
                        style="
                            background-color: #555;
                            padding: 6px 12px;
                            font-size: 12px;
                        ">
                        📥 Export CSV
                    </button>

                    <label
                        for="csvFileInput"
                        style="
                            background-color: #2b5b84;
                            color: white;
                            padding: 6px 12px;
                            font-size: 12px;
                            border-radius: 6px;
                            cursor: pointer;
                            font-weight: 600;
                        ">
                        📤 Import CSV
                    </label>

                    <input
                        type="file"
                        id="csvFileInput"
                        accept=".csv"
                        onchange="importCSV(event)"
                        style="display: none;"
                    >

                </div>

            </div>

            <!-- Registry Table -->
            <table class="registry-table">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Variety</th>
                        <th>Origin</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="registryTableBody">
                    <!-- Registry rows will be added by JavaScript -->
                </tbody>

            </table>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
